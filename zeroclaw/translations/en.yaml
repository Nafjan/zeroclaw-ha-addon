configuration:
  openrouter_api_key:
    name: OpenRouter API key
    description: Required. Used directly by native ZeroClaw; stored in its private configuration.
  telegram_bot_token:
    name: Telegram bot token
    description: Optional. Use a private owner bot and disable group joining in BotFather.
  telegram_owner_id:
    name: Telegram owner ID
    description: Your positive numeric Telegram user ID. Only this sender is authorized; usernames
      and automatic enrollment are not supported.
  telegram_allowed_users:
    name: Legacy Telegram IDs
    description: Upgrade compatibility only. The first numeric ID is used until an explicit
      owner ID is supplied; additional IDs are retired.
  ha_mcp_enabled:
    name: Connect Home Assistant
    description: Enable after configuring Device control only and Read-only on the main Home
      Assistant MCP endpoint.
  ha_mcp_url:
    name: Home Assistant MCP URL
    description: The reachable main URL ending in /api/mcp. Use HTTPS across untrusted networks.
      Individual API URLs are not supported.
  ha_mcp_token:
    name: Home Assistant MCP token
    description: A new long-lived access token for a dedicated non-administrator Home Assistant
      account permitted to use the main endpoint.
  default_model:
    name: Primary model
    description: 'The native fast route. Default: DeepSeek V4 Flash through OpenRouter.'
  complex_model:
    name: Reasoning model
    description: 'The native reasoning route, selected with /model reasoning. Default: OpenRouter
      Fusion.'
  openrouter_fusion_preset:
    name: Fusion preset
    description: The preset sent when the reasoning model is openrouter/fusion. General budget
      is the default.
  automatic_model_routing:
    name: Automatic model selection
    description: Optional native complexity heuristic. Long messages, code fences or reasoning
      keywords can select the more expensive reasoning model. Off by default.
  daily_cost_limit_usd:
    name: Daily estimated cost limit
    description: Native block threshold in USD. Accounting uses conservative configured rates,
      not actual provider prices or an independent reservation.
  monthly_cost_limit_usd:
    name: Monthly estimated cost limit
    description: Native block threshold in USD. Use the provider account limit when an independent
      spending limit is needed.
  provider_max_tokens:
    name: Maximum reply tokens
    description: Maximum model output tokens per request.
  max_tool_iterations:
    name: Maximum tool iterations
    description: Maximum native tool-loop iterations in a turn.
  max_actions_per_hour:
    name: Hourly action limit
    description: Native ZeroClaw action-rate limit.
  max_history_messages:
    name: Conversation history
    description: Maximum messages retained in the model context.
  max_context_tokens:
    name: Context token limit
    description: Native context limit before compaction.
  response_cache_ttl_minutes:
    name: Response cache lifetime
    description: Native cache lifetime in minutes. Zero expires cached responses immediately.
  conversation_retention_days:
    name: Conversation retention
    description: Native conversation retention in days.
