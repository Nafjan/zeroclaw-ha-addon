name: Publish verified canary alias

on:
  workflow_dispatch:
    inputs:
      source_digest:
        description: "Exact candidate image digest to alias"
        required: true
        type: string
      candidate_tag:
        description: "Exact signed candidate tag, for example candidate-123456-abcdef123456"
        required: true
        type: string
      candidate_commit:
        description: "Full add-on commit used by the candidate build"
        required: true
        type: string
      version:
        description: "Four-part app version from zeroclaw/config.yaml"
        required: true
        type: string
      target_tag:
        description: "Temporary canary tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish exact candidate digest as temporary canary tag
    runs-on: ubuntu-latest
    environment:
      name: release-builder
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Publish and verify immutable canary alias
        shell: bash
        env:
          IMAGE: ghcr.io/nafjan/zeroclaw-ha-addon
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          VERSION: ${{ inputs.version }}
          TARGET_TAG: ${{ inputs.target_tag }}
          COSIGN_EXPERIMENTAL: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s' "$CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CANDIDATE_TAG" | grep -Eq '^candidate-[0-9]+-[0-9a-f]{12}$'
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          version_regex="$(printf '%s' "$VERSION" | sed 's/\./\\./g')"
          printf '%s' "$TARGET_TAG" | grep -Eq "^${version_regex}-canary\.[0-9]+$"
          candidate_suffix="${CANDIDATE_TAG#candidate-}"
          candidate_run_id="${candidate_suffix%-????????????}"
          candidate_commit_prefix="${candidate_suffix#*-}"
          target_prefix="${VERSION}-canary."
          target_run_id="${TARGET_TAG#"$target_prefix"}"
          test "$candidate_commit_prefix" = "${CANDIDATE_COMMIT:0:12}"
          test "$candidate_run_id" = "$target_run_id"
          candidate_digest="$(docker buildx imagetools inspect "${IMAGE}:${CANDIDATE_TAG}" --format '{{.Manifest.Digest}}')"
          test "$candidate_digest" = "$SOURCE_DIGEST"
          image_ref="${IMAGE}@${SOURCE_DIGEST}"
          docker pull --platform linux/arm64 "$image_ref"
          image_revision="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$image_revision" = "$CANDIDATE_COMMIT"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/heads/.+$" \
            "$image_ref"
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://spdx.dev/Document/v2.3
          if existing_digest="$(docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            test "$existing_digest" = "$SOURCE_DIGEST" || {
              echo "refusing to retarget existing canary tag ${TARGET_TAG}" >&2
              exit 1
            }
          else
            docker buildx imagetools create \
              --tag "${IMAGE}:${TARGET_TAG}" \
              "${IMAGE}@${SOURCE_DIGEST}"
          fi
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}" --format '{{.Manifest.Digest}}')"
          test "${resolved}" = "${SOURCE_DIGEST}"
          printf 'canary_tag=%s:%s\ncanary_digest=%s\n' "${IMAGE}" "${TARGET_TAG}" "${resolved}"
