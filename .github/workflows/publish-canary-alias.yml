name: Publish verified canary alias

on:
  workflow_dispatch:
    inputs:
      source_digest:
        description: "Exact candidate image digest to alias"
        required: true
        type: string
      candidate_tag:
        description: "Exact signed candidate tag, for example candidate-123456-abcdef123456"
        required: true
        type: string
      candidate_commit:
        description: "Full add-on commit used by the candidate build"
        required: true
        type: string
      version:
        description: "Four-part app version from zeroclaw/config.yaml"
        required: true
        type: string
      target_tag:
        description: "Temporary canary tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zeroclaw-canary-alias-${{ inputs.target_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact candidate digest as temporary canary tag
    runs-on: ubuntu-latest
    environment:
      name: release-builder
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - name: Check out the workflow revision for release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The candidate image is verified independently below.  Use the
          # workflow revision for the descriptor renderer so a later alias
          # cannot silently resurrect an obsolete renderer from the candidate
          # commit (for example, one that violates Supervisor's image schema).
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Install pinned GitHub CLI
        shell: bash
        env:
          GH_VERSION: "2.97.0"
          GH_SHA256: "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/gh-cli"
          url="https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error --output "$archive" "$url"
          printf '%s  %s\n' "$GH_SHA256" "$archive" | sha256sum --check -
          rm -rf -- "$install_dir"
          mkdir -p -- "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=2 "gh_${GH_VERSION}_linux_amd64/bin/gh"
          test -x "$install_dir/gh"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gh" version

      - name: Publish and verify immutable canary alias
        shell: bash
        env:
          IMAGE: ghcr.io/nafjan/zeroclaw-ha-addon
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          VERSION: ${{ inputs.version }}
          TARGET_TAG: ${{ inputs.target_tag }}
          COSIGN_EXPERIMENTAL: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s' "$CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CANDIDATE_TAG" | grep -Eq '^candidate-[0-9]+-[0-9a-f]{12}$'
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          version_regex="$(printf '%s' "$VERSION" | sed 's/\./\\./g')"
          printf '%s' "$TARGET_TAG" | grep -Eq "^${version_regex}-canary\.[0-9]+$"
          candidate_suffix="${CANDIDATE_TAG#candidate-}"
          candidate_run_id="${candidate_suffix%-????????????}"
          candidate_commit_prefix="${candidate_suffix#*-}"
          target_prefix="${VERSION}-canary."
          target_run_id="${TARGET_TAG#"$target_prefix"}"
          printf '%s' "$candidate_run_id" | grep -Eq '^[0-9]+$'
          test "$candidate_commit_prefix" = "${CANDIDATE_COMMIT:0:12}"
          test "$candidate_run_id" = "$target_run_id"
          # A signed image and valid attestations are not sufficient for the
          # canary alias. Require the exact candidate to have completed on
          # master using the dedicated reproducible release runner.
          candidate_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}")"
          printf '%s' "$candidate_run_json" | jq -e \
            --arg commit "$CANDIDATE_COMMIT" \
            '(.path == ".github/workflows/release.yml") and
             (.event == "workflow_dispatch") and
             (.head_branch == "master") and
             (.head_sha == $commit) and
             (.status == "completed") and
             (.conclusion == "success")' >/dev/null
          candidate_jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/jobs?per_page=100")"
          printf '%s' "$candidate_jobs_json" | jq -e \
            '([.jobs[] | select(.name == "Rebuild, attest, and sign candidate digest")] | length == 1) and
             ([.jobs[] | select(.name == "Rebuild, attest, and sign candidate digest")][0] |
              (.status == "completed") and
              (.conclusion == "success") and
              (.labels | index("zeroclaw-release-linux-x64") != null))' >/dev/null
          candidate_digest="$(docker buildx imagetools inspect "${IMAGE}:${CANDIDATE_TAG}" --format '{{.Manifest.Digest}}')"
          test "$candidate_digest" = "$SOURCE_DIGEST"
          image_ref="${IMAGE}@${SOURCE_DIGEST}"
          docker pull --platform linux/arm64 "$image_ref"
          image_revision="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$image_revision" = "$CANDIDATE_COMMIT"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/heads/master$" \
            "$image_ref"
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://spdx.dev/Document/v2.3
          if existing_digest="$(docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            test "$existing_digest" = "$SOURCE_DIGEST" || {
              echo "refusing to retarget existing canary tag ${TARGET_TAG}" >&2
              exit 1
            }
          else
            docker buildx imagetools create \
              --tag "${IMAGE}:${TARGET_TAG}" \
              "${IMAGE}@${SOURCE_DIGEST}"
          fi
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}" --format '{{.Manifest.Digest}}')"
          test "${resolved}" = "${SOURCE_DIGEST}"
          printf 'canary_tag=%s:%s\ncanary_digest=%s\n' "${IMAGE}" "${TARGET_TAG}" "${resolved}"

      - name: Render and verify the mandatory side-load descriptor
        id: descriptor
        shell: bash
        env:
          IMAGE: ghcr.io/nafjan/zeroclaw-ha-addon
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          descriptor_dir="$RUNNER_TEMP/zeroclaw-canary-descriptor"
          test ! -e "$descriptor_dir"
          bash .github/scripts/render-canary-descriptor.sh \
            zeroclaw/config.yaml "$IMAGE" "$TARGET_TAG" "$SOURCE_DIGEST" \
            "$CANDIDATE_COMMIT" "$descriptor_dir"
          descriptor_sha256="$(sha256sum "$descriptor_dir/config.yaml" | awk '{print $1}')"
          bash .github/scripts/verify-canary-descriptor.sh \
            "$descriptor_dir/config.yaml" "$IMAGE" "$TARGET_TAG" "$SOURCE_DIGEST" \
            "$CANDIDATE_COMMIT" "$descriptor_sha256"
          jq -e --arg image "$IMAGE" \
            --arg resolved_image "$IMAGE:$TARGET_TAG@$SOURCE_DIGEST" \
             --arg tag "$TARGET_TAG" --arg digest "$SOURCE_DIGEST" \
             --arg commit "$CANDIDATE_COMMIT" --arg sha "$descriptor_sha256" \
            '(.schema_version == 2) and
             (.descriptor_kind == "homeassistant_local_app") and
             (.app_slug == "zeroclaw_canary") and
             (.version == $tag) and
             (.image == $image) and
             (.image_tag == $tag) and
             (.resolved_image == $resolved_image) and
             (.candidate_tag == $tag) and
             (.candidate_digest == $digest) and
             (.candidate_commit == $commit) and
             (.config_sha256 == $sha) and
             (.minimum_supervisor_version == "2026.04.0")' \
            "$descriptor_dir/canary-identity.json" >/dev/null
          printf 'descriptor_sha256=%s\n' "$descriptor_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the mandatory side-load descriptor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeroclaw-canary-descriptor-${{ inputs.target_tag }}
          path: ${{ runner.temp }}/zeroclaw-canary-descriptor
          if-no-files-found: error
          retention-days: 7
