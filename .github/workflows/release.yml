name: Release signed Supervisor image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to create after promotion, for example v3.1.3.5"
        required: true
        type: string
      promote:
        description: "Run the protected canary and production promotion gates"
        required: true
        default: false
        type: boolean
      canary_digest:
        description: "Candidate digest copied from the build job after the HA canary"
        required: false
        type: string
      canary_evidence:
        description: "Link or ticket identifying the completed read-only HA canary"
        required: false
        type: string
      builder_mode:
        description: "Reproducible builder implementation to exercise"
        required: false
        default: cross
        type: choice
        options:
          - cross
          - direct
          - direct-aa
          - trusted-aa

permissions:
  contents: read

jobs:
  acceptance:
    name: Complete acceptance suite before candidate publication
    uses: ./.github/workflows/test.yml
    with:
      require_verified_artifact: true
    permissions:
      contents: read

  candidate:
    name: Rebuild, attest, and sign candidate digest
    needs: acceptance
    runs-on: ${{ inputs.builder_mode == 'trusted-aa' && 'zeroclaw-release-linux-x64' || 'ubuntu-latest' }}
    environment:
      name: ${{ inputs.builder_mode == 'trusted-aa' && 'release-builder' || 'hosted-build' }}
    concurrency:
      group: zeroclaw-candidate-${{ inputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      candidate_tag: ${{ steps.metadata.outputs.candidate_tag }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      certificate_identity: ${{ steps.metadata.outputs.certificate_identity }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILDER_MODE: ${{ inputs.builder_mode }}
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" {print $2; exit}' zeroclaw/config.yaml)"
          builder_mode="${BUILDER_MODE:-cross}"
          case "$builder_mode" in
            cross|direct|direct-aa|trusted-aa) ;;
            *) echo "unsupported builder_mode=$builder_mode" >&2; exit 1 ;;
          esac
          release_tag="$RELEASE_TAG"
          release_version="${release_tag#v}"
          source_repository="$(jq -r '.source_repository' zeroclaw/binary-manifest.json)"
          source_commit="$(jq -r '.source_commit' zeroclaw/binary-manifest.json)"
          source_date_epoch="$(jq -r '.source_date_epoch' zeroclaw/binary-manifest.json)"
          source_lockfile_sha256="$(jq -r '.source_lockfile_sha256' zeroclaw/binary-manifest.json)"
          llvm_rng_seed="$(jq -r '.llvm_rng_seed' zeroclaw/binary-manifest.json)"
          target="$(jq -r '.target' zeroclaw/binary-manifest.json)"
          rust_toolchain="$(jq -r '.rust_toolchain' zeroclaw/binary-manifest.json)"
          cross_version="$(jq -r '.cross_version' zeroclaw/binary-manifest.json)"
          cross_image_digest="$(jq -r '.cross_image_digest' zeroclaw/binary-manifest.json)"
          cargo_incremental="$(jq -r '.cargo_incremental' zeroclaw/binary-manifest.json)"
          rustflags="$(jq -r '.rustflags' zeroclaw/binary-manifest.json)"
          artifact_status="$(jq -r '.artifact_status' zeroclaw/binary-manifest.json)"
          build_command="$(jq -r '.build_command' zeroclaw/binary-manifest.json)"
          binary_sha="$(jq -r '.sha256' zeroclaw/binary-manifest.json)"
          configured_image="$(awk '$1 == "image:" {print $2; exit}' zeroclaw/config.yaml)"
          image="$(printf '%s' "$configured_image" | tr '[:upper:]' '[:lower:]')"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}"
          test "$GITHUB_REPOSITORY" = "Nafjan/zeroclaw-ha-addon"
          test "$release_version" = "$version"
          printf '%s' "$release_tag" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          test "$source_repository" = "https://github.com/zeroclaw-labs/zeroclaw.git"
          test "$source_commit" != "null"
          test "$source_date_epoch" != "null"
          test "$source_lockfile_sha256" != "null"
          test "$llvm_rng_seed" = "0"
          test "$target" = "aarch64-unknown-linux-musl"
          test "$rust_toolchain" = "1.89.0"
          test "$cross_version" = "0.2.5"
          printf '%s' "$cross_image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$cargo_incremental" = "false"
          test "$artifact_status" = "verified"
          test -n "$rustflags"
          test "$build_command" = "cargo build --release --locked --target aarch64-unknown-linux-musl"
          test -n "$binary_sha"
          test -n "$image"
          if [ "$builder_mode" = "trusted-aa" ]; then
            test "$GITHUB_REF" = "refs/heads/master"
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'builder_mode=%s\n' "$builder_mode"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
            printf 'source_lockfile_sha256=%s\n' "$source_lockfile_sha256"
            printf 'llvm_rng_seed=%s\n' "$llvm_rng_seed"
            printf 'target=%s\n' "$target"
            printf 'rust_toolchain=%s\n' "$rust_toolchain"
            printf 'cross_version=%s\n' "$cross_version"
            printf 'cross_image_digest=%s\n' "$cross_image_digest"
            printf 'cargo_incremental=%s\n' "$cargo_incremental"
            printf 'rustflags=%s\n' "$rustflags"
            printf 'binary_sha=%s\n' "$binary_sha"
            printf 'image=%s\n' "$image"
            printf 'candidate_tag=%s\n' "$candidate_tag"
            printf 'certificate_identity=%s\n' "$certificate_identity"
          } >> "$GITHUB_OUTPUT"

      - name: Check out pinned ZeroClaw source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: ${{ steps.metadata.outputs.source_commit }}
          path: .zeroclaw-source
          fetch-depth: 1

      - name: Set up QEMU
        if: ${{ steps.metadata.outputs.builder_mode == 'cross' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Validate trusted release builder contract
        if: ${{ steps.metadata.outputs.builder_mode == 'trusted-aa' }}
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ steps.metadata.outputs.rust_toolchain }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          docker_config="$RUNNER_TEMP/zeroclaw-docker-config"
          mkdir -p "$docker_config"
          printf '%s\n' '{"auths":{}}' > "$docker_config/config.json"
          chmod 700 "$docker_config"
          chmod 600 "$docker_config/config.json"
          export DOCKER_CONFIG="$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
          for command in bash cargo docker git jq rustc rustup sha256sum stat; do
            command -v "$command" >/dev/null
          done
          test "$(docker info --format '{{.OSType}}')" = "linux"
          test -d "$HOME/.cargo"
          toolchain_rustc="$(rustup which --toolchain "$RUST_TOOLCHAIN" rustc)"
          test -x "$toolchain_rustc"
          printf 'trusted release builder contract: %s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          printf 'toolchain rustc: %s\n' "$toolchain_rustc"

      - name: Rebuild and verify artifact with direct pinned builder
        if: ${{ steps.metadata.outputs.builder_mode == 'direct' }}
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
          SOURCE_LOCKFILE_SHA256: ${{ steps.metadata.outputs.source_lockfile_sha256 }}
          TARGET: ${{ steps.metadata.outputs.target }}
          RUST_TOOLCHAIN: ${{ steps.metadata.outputs.rust_toolchain }}
          CROSS_VERSION: ${{ steps.metadata.outputs.cross_version }}
          CROSS_IMAGE_DIGEST: ${{ steps.metadata.outputs.cross_image_digest }}
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ steps.metadata.outputs.rustflags }}
          BINARY_SHA: ${{ steps.metadata.outputs.binary_sha }}
        run: |
          set -euo pipefail
          source_dir="$PWD/.zeroclaw-source"
          cross_image="ghcr.io/cross-rs/aarch64-unknown-linux-musl:${CROSS_VERSION}"
          cross_image_ref="ghcr.io/cross-rs/aarch64-unknown-linux-musl@${CROSS_IMAGE_DIGEST}"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C "$source_dir" show -s --format=%ct HEAD)" = "$SOURCE_DATE_EPOCH"
          test "$(sha256sum "$source_dir/Cargo.lock" | awk '{print $1}')" = "$SOURCE_LOCKFILE_SHA256"
          docker pull "$cross_image"
          docker image inspect "$cross_image" --format '{{json .RepoDigests}}' | grep -F "$cross_image_ref" >/dev/null

          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$TARGET"
          rustc --version --verbose
          cargo --version --verbose
          cargo fetch --manifest-path "$source_dir/Cargo.toml" --locked

          host_diag="$RUNNER_TEMP/zeroclaw-direct-host.txt"
          container_diag="$RUNNER_TEMP/zeroclaw-direct-container.txt"
          direct_log="$RUNNER_TEMP/zeroclaw-direct-build.log"
          direct_summary="$RUNNER_TEMP/zeroclaw-direct-summary.txt"
          direct_deps="$RUNNER_TEMP/zeroclaw-direct-deps"
          mkdir -p "$direct_deps"
          : > "$container_diag"
          : > "$direct_summary"
          {
            printf 'builder_mode=direct\n'
            printf 'runner_temp=%s\n' "$RUNNER_TEMP"
            printf 'workspace=%s\n' "$GITHUB_WORKSPACE"
            uname -a
            lscpu --json 2>&1 || true
            docker version
            docker info --format '{{json .}}' 2>&1 || true
            stat -f -c 'workspace_mount=%T' "$GITHUB_WORKSPACE"
            stat -f -c 'runner_temp_mount=%T' "$RUNNER_TEMP"
          } > "$host_diag"

          project_volume="zeroclaw-direct-project-${GITHUB_RUN_ID}"
          target_volume="zeroclaw-direct-target-${GITHUB_RUN_ID}"
          source_archive="$RUNNER_TEMP/zeroclaw-source-${GITHUB_RUN_ID}.tar"
          cleanup() {
            docker volume rm "$project_volume" "$target_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$project_volume" >/dev/null
          docker volume create "$target_volume" >/dev/null
          git -C "$source_dir" archive --format=tar --output="$source_archive" "$SOURCE_COMMIT"
          docker run --rm --network none \
            --mount "type=volume,source=$project_volume,target=/project" \
            --mount "type=bind,source=$source_archive,target=/tmp/zeroclaw-source.tar,readonly" \
            --entrypoint /bin/sh "$cross_image_ref" -ec \
            'set -eu; tar -xf /tmp/zeroclaw-source.tar -C /project; test -f /project/Cargo.lock; test ! -d /project/target'

          docker run --rm --network none \
            --mount "type=volume,source=$project_volume,target=/project" \
            --mount "type=volume,source=$target_volume,target=/target" \
            --mount "type=bind,source=$(rustup which --toolchain "$RUST_TOOLCHAIN" rustc | sed 's#/bin/rustc$##'),target=/rust,readonly" \
            --mount "type=bind,source=$HOME/.cargo,target=/cargo" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/zeroclaw/zeroclaw-bin,target=/out/zeroclaw-bin" \
            --mount "type=bind,source=$host_diag,target=/out/host.txt,readonly" \
            --mount "type=bind,source=$container_diag,target=/out/container.txt" \
            --mount "type=bind,source=$direct_summary,target=/out/summary.txt" \
            --mount "type=bind,source=$direct_deps,target=/out/deps" \
            --workdir /project \
            --entrypoint /bin/sh \
            -e SOURCE_DATE_EPOCH -e CARGO_INCREMENTAL -e RUSTFLAGS -e TARGET -e BINARY_SHA \
            "$cross_image_ref" -ec '
              set -eu
              export PATH=/rust/bin:$PATH
              export LD_LIBRARY_PATH=/rust/lib:/rust/lib/rustlib/x86_64-unknown-linux-gnu/lib
              export CARGO_HOME=/cargo
              export CARGO_TARGET_DIR=/target
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="$RUSTFLAGS"
              {
                printf "uname="; uname -a
                printf "nproc="; nproc
                printf "cpu="; grep -m1 -E "model name|Hardware|vendor_id" /proc/cpuinfo || true
                printf "mounts:\n"; mount || true
                printf "rustc_sha="; sha256sum /rust/bin/rustc
                printf "cargo_sha="; sha256sum /rust/bin/cargo
                rustc -vV
                cargo -vV
              } | tee /out/container.txt
              cargo build -vv --release --locked --jobs 8 --target "$TARGET" --manifest-path Cargo.toml
              rebuilt="/target/$TARGET/release/zeroclaw"
              test -f "$rebuilt"
              sha="$(sha256sum "$rebuilt" | awk "{print \$1}")"
              size="$(stat -c "%s" "$rebuilt")"
              printf "sha=%s\nsize=%s\n" "$sha" "$size" | tee /out/summary.txt
              for item in /target/$TARGET/release/deps/libzeroclaw_channels-*.rlib /target/$TARGET/release/deps/libzeroclaw_channels-*.rmeta; do
                [ -f "$item" ] && cp "$item" /out/deps/
              done
              cp "$rebuilt" /out/zeroclaw-bin
              test "$sha" = "$BINARY_SHA"
            ' | tee "$direct_log"
          test "$(sha256sum zeroclaw/zeroclaw-bin | awk '{print $1}')" = "$BINARY_SHA"
          test "$(stat -c '%s' zeroclaw/zeroclaw-bin)" = "17815496"

      - name: Rebuild twice with isolated direct pinned builders
        if: ${{ steps.metadata.outputs.builder_mode == 'direct-aa' || steps.metadata.outputs.builder_mode == 'trusted-aa' }}
        shell: bash
        env:
          BUILDER_MODE: ${{ steps.metadata.outputs.builder_mode }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
          SOURCE_LOCKFILE_SHA256: ${{ steps.metadata.outputs.source_lockfile_sha256 }}
          TARGET: ${{ steps.metadata.outputs.target }}
          RUST_TOOLCHAIN: ${{ steps.metadata.outputs.rust_toolchain }}
          CROSS_VERSION: ${{ steps.metadata.outputs.cross_version }}
          CROSS_IMAGE_DIGEST: ${{ steps.metadata.outputs.cross_image_digest }}
          CARGO_INCREMENTAL: "0"
          TARGET_RUSTFLAGS: ${{ steps.metadata.outputs.rustflags }}
          BINARY_SHA: ${{ steps.metadata.outputs.binary_sha }}
        run: |
          set -euo pipefail
          source_dir="$PWD/.zeroclaw-source"
          cross_image="ghcr.io/cross-rs/aarch64-unknown-linux-musl:$CROSS_VERSION"
          cross_image_ref="ghcr.io/cross-rs/aarch64-unknown-linux-musl@$CROSS_IMAGE_DIGEST"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C "$source_dir" show -s --format=%ct HEAD)" = "$SOURCE_DATE_EPOCH"
          test "$(sha256sum "$source_dir/Cargo.lock" | awk '{print $1}')" = "$SOURCE_LOCKFILE_SHA256"
          docker pull "$cross_image"
          docker image inspect "$cross_image" --format '{{json .RepoDigests}}' | grep -F "$cross_image_ref" >/dev/null

          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$TARGET"
          rustc --version --verbose
          cargo --version --verbose
          cargo fetch --manifest-path "$source_dir/Cargo.toml" --locked

          toolchain_real="$(rustup which --toolchain "$RUST_TOOLCHAIN" rustc)"
          toolchain_root="$(cd "$(dirname "$toolchain_real")/.." && pwd)"
          host_diag="$RUNNER_TEMP/zeroclaw-direct-aa-host.txt"
          container_diag_a="$RUNNER_TEMP/zeroclaw-direct-aa-container-a.txt"
          container_diag_b="$RUNNER_TEMP/zeroclaw-direct-aa-container-b.txt"
          direct_log_a="$RUNNER_TEMP/zeroclaw-direct-aa-build-a.log"
          direct_log_b="$RUNNER_TEMP/zeroclaw-direct-aa-build-b.log"
          direct_summary_a="$RUNNER_TEMP/zeroclaw-direct-aa-summary-a.txt"
          direct_summary_b="$RUNNER_TEMP/zeroclaw-direct-aa-summary-b.txt"
          direct_binary_a="$RUNNER_TEMP/zeroclaw-direct-aa-a.elf"
          direct_binary_b="$RUNNER_TEMP/zeroclaw-direct-aa-b.elf"
          direct_deps="$RUNNER_TEMP/zeroclaw-direct-aa-deps"
          cargo_cache_archive="$RUNNER_TEMP/zeroclaw-cargo-cache-$GITHUB_RUN_ID.tar"
          mkdir -p "$direct_deps/a" "$direct_deps/b"
          : > "$container_diag_a"
          : > "$container_diag_b"
          : > "$direct_summary_a"
          : > "$direct_summary_b"
          : > "$direct_binary_a"
          : > "$direct_binary_b"
          {
            printf 'builder_mode=%s\n' "$BUILDER_MODE"
            printf 'runner_temp=%s\n' "$RUNNER_TEMP"
            printf 'workspace=%s\n' "$GITHUB_WORKSPACE"
            printf 'toolchain_root=%s\n' "$toolchain_root"
            uname -a
            lscpu --json 2>&1 || true
            docker version
            docker info --format '{{json .}}' 2>&1 || true
            stat -f -c 'workspace_mount=%T' "$GITHUB_WORKSPACE"
            stat -f -c 'runner_temp_mount=%T' "$RUNNER_TEMP"
          } > "$host_diag"

          project_volume_a="zeroclaw-direct-aa-project-a-$GITHUB_RUN_ID"
          target_volume_a="zeroclaw-direct-aa-target-a-$GITHUB_RUN_ID"
          cargo_volume_a="zeroclaw-direct-aa-cargo-a-$GITHUB_RUN_ID"
          project_volume_b="zeroclaw-direct-aa-project-b-$GITHUB_RUN_ID"
          target_volume_b="zeroclaw-direct-aa-target-b-$GITHUB_RUN_ID"
          cargo_volume_b="zeroclaw-direct-aa-cargo-b-$GITHUB_RUN_ID"
          source_archive="$RUNNER_TEMP/zeroclaw-source-$GITHUB_RUN_ID.tar"
          cleanup() {
            docker volume rm \
              "$project_volume_a" "$target_volume_a" "$cargo_volume_a" \
              "$project_volume_b" "$target_volume_b" "$cargo_volume_b" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$project_volume_a" >/dev/null
          docker volume create "$target_volume_a" >/dev/null
          docker volume create "$cargo_volume_a" >/dev/null
          docker volume create "$project_volume_b" >/dev/null
          docker volume create "$target_volume_b" >/dev/null
          docker volume create "$cargo_volume_b" >/dev/null
          git -C "$source_dir" archive --format=tar --output="$source_archive" "$SOURCE_COMMIT"
          tar -cf "$cargo_cache_archive" -C "$HOME/.cargo" registry
          if [ -d "$HOME/.cargo/git" ]; then
            tar -rf "$cargo_cache_archive" -C "$HOME/.cargo" git
          fi
          for project_volume in "$project_volume_a" "$project_volume_b"; do
            docker run --rm --network none \
              --mount "type=volume,source=$project_volume,target=/project" \
              --mount "type=bind,source=$source_archive,target=/tmp/zeroclaw-source.tar,readonly" \
              --entrypoint /bin/sh "$cross_image_ref" -ec \
              'set -eu; tar -xf /tmp/zeroclaw-source.tar -C /project; test -f /project/Cargo.lock; test ! -d /project/target'
          done
          for cargo_volume in "$cargo_volume_a" "$cargo_volume_b"; do
            docker run --rm --network none \
              --mount "type=volume,source=$cargo_volume,target=/cargo" \
              --mount "type=bind,source=$cargo_cache_archive,target=/tmp/zeroclaw-cargo-cache.tar,readonly" \
              --entrypoint /bin/sh "$cross_image_ref" -ec \
              'set -eu; tar -xf /tmp/zeroclaw-cargo-cache.tar -C /cargo; test -d /cargo/registry'
          done

          run_direct_aa_build() {
            local label="$1"
            local project_volume="$2"
            local target_volume="$3"
            local cargo_volume="$4"
            local container_diag="$5"
            local direct_summary="$6"
            local direct_binary="$7"
            local direct_log="$8"
            local direct_deps="$9"
            docker run --rm --network none \
              --mount "type=volume,source=$project_volume,target=/project" \
              --mount "type=volume,source=$target_volume,target=/target" \
              --mount "type=volume,source=$cargo_volume,target=/cargo" \
              --mount "type=bind,source=$toolchain_root,target=/rust,readonly" \
              --mount "type=bind,source=$direct_binary,target=/out/zeroclaw-bin" \
              --mount "type=bind,source=$container_diag,target=/out/container.txt" \
              --mount "type=bind,source=$direct_summary,target=/out/summary.txt" \
              --mount "type=bind,source=$direct_deps,target=/out/deps" \
              --workdir /project \
              --entrypoint /bin/sh \
              -e "BUILD_LABEL=$label" \
              -e "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
              -e "CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
              -e "TARGET=$TARGET" \
              -e "TARGET_RUSTFLAGS=$TARGET_RUSTFLAGS" \
              "$cross_image_ref" -ec '
                set -eu
                export PATH=/rust/bin:$PATH
                export LD_LIBRARY_PATH=/rust/lib:/rust/lib/rustlib/x86_64-unknown-linux-gnu/lib
                export CARGO_HOME=/cargo
                export CARGO_TARGET_DIR=/target
                unset RUSTFLAGS
                export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="$TARGET_RUSTFLAGS"
                {
                  printf "label=%s\n" "$BUILD_LABEL"
                  printf "uname="; uname -a
                  printf "nproc="; nproc
                  printf "cpu="; grep -m1 -E "model name|Hardware|vendor_id" /proc/cpuinfo || true
                  printf "mounts:\n"; mount || true
                  printf "rustc_sha="; sha256sum /rust/bin/rustc
                  printf "cargo_sha="; sha256sum /rust/bin/cargo
                  rustc -vV
                  cargo -vV
                } | tee /out/container.txt
                cargo build -vv --release --locked --jobs 8 --target "$TARGET" --manifest-path Cargo.toml
                rebuilt="/target/$TARGET/release/zeroclaw"
                test -f "$rebuilt"
                sha="$(sha256sum "$rebuilt" | awk "{print \$1}")"
                size="$(stat -c "%s" "$rebuilt")"
                printf "sha=%s\nsize=%s\n" "$sha" "$size" | tee /out/summary.txt
                find /target/$TARGET/release/deps -maxdepth 1 -type f \( -name "*.rlib" -o -name "*.rmeta" \) -print0 |
                  sort -z | xargs -0 -r sha256sum > "/out/deps/$BUILD_LABEL-all-deps.txt"
                for crate in channels gateway runtime zeroclaw; do
                  case "$crate" in
                    zeroclaw) prefix=libzeroclaw ;;
                    *) prefix="libzeroclaw_$crate" ;;
                  esac
                  for suffix in rlib rmeta; do
                    item="$(find /target/$TARGET/release/deps -maxdepth 1 -type f -name "$prefix-*.$suffix" -print -quit)"
                    if [ -n "$item" ]; then
                      cp "$item" "/out/deps/$BUILD_LABEL-$crate.$suffix"
                    fi
                  done
                done
                cp "$rebuilt" /out/zeroclaw-bin
              ' | tee "$direct_log"
          }

          run_direct_aa_build \
            a "$project_volume_a" "$target_volume_a" "$cargo_volume_a" \
            "$container_diag_a" "$direct_summary_a" "$direct_binary_a" \
            "$direct_log_a" "$direct_deps/a"
          run_direct_aa_build \
            b "$project_volume_b" "$target_volume_b" "$cargo_volume_b" \
            "$container_diag_b" "$direct_summary_b" "$direct_binary_b" \
            "$direct_log_b" "$direct_deps/b"

          sha_a="$(sha256sum "$direct_binary_a" | awk '{print $1}')"
          sha_b="$(sha256sum "$direct_binary_b" | awk '{print $1}')"
          printf 'direct-aa hashes: a=%s b=%s expected=%s\n' \
            "$sha_a" "$sha_b" "$BINARY_SHA"
          cmp -s "$direct_binary_a" "$direct_binary_b"
          test "$sha_a" = "$BINARY_SHA"
          test "$sha_b" = "$BINARY_SHA"
          cp "$direct_binary_b" zeroclaw/zeroclaw-bin
          test "$(sha256sum zeroclaw/zeroclaw-bin | awk '{print $1}')" = "$BINARY_SHA"
          test "$(stat -c '%s' zeroclaw/zeroclaw-bin)" = "17815496"

      - name: Rebuild and verify the recorded ZeroClaw artifact
        if: ${{ steps.metadata.outputs.builder_mode == 'cross' }}
        shell: bash
        env:
          CROSS_CONTAINER_ENGINE: docker
          CROSS_DEBUG: "1"
          ZEROCLAW_RUST_TOOLCHAIN: ${{ steps.metadata.outputs.rust_toolchain }}
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          test "$(git -C .zeroclaw-source rev-parse HEAD)" = "${{ steps.metadata.outputs.source_commit }}"
          source_epoch="$(git -C .zeroclaw-source show -s --format=%ct HEAD)"
          test "$source_epoch" = "${{ steps.metadata.outputs.source_date_epoch }}"
          lock_sha="$(sha256sum .zeroclaw-source/Cargo.lock | awk '{print $1}')"
          test "$lock_sha" = "${{ steps.metadata.outputs.source_lockfile_sha256 }}"
          cross_image="ghcr.io/cross-rs/aarch64-unknown-linux-musl:${{ steps.metadata.outputs.cross_version }}"
          cross_image_ref="ghcr.io/cross-rs/aarch64-unknown-linux-musl@${{ steps.metadata.outputs.cross_image_digest }}"
          docker pull "$cross_image"
          docker image inspect "$cross_image" --format '{{json .RepoDigests}}' | grep -F "$cross_image_ref" >/dev/null
          export SOURCE_DATE_EPOCH="$source_epoch"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="${{ steps.metadata.outputs.rustflags }}"
          export CROSS_CONFIG="$PWD/.cross-release.toml"
          toolchain_version="$ZEROCLAW_RUST_TOOLCHAIN"
          test -n "$toolchain_version"
          write_cross_config() {
            {
              printf '%s\n' \
                '[build.env]' \
                'passthrough = [' \
                '  "SOURCE_DATE_EPOCH",' \
                '  "CARGO_INCREMENTAL",' \
                '  "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS",'
              printf '%s\n' \
                ']' \
                '' \
                '[target.aarch64-unknown-linux-musl]' \
                'image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl@${{ steps.metadata.outputs.cross_image_digest }}"'
            } > "$CROSS_CONFIG"
          }
          # Build from the pinned source checkout root. The recorded artifact was
          # built with --remap-path-prefix=/project=.; compiling from the parent
          # checkout would preserve a different `.zeroclaw-source/` prefix.
          pushd .zeroclaw-source >/dev/null
          # Use Cross's canonical target root: it mounts the host checkout's
          # `target/` directory as `/target` inside the build container. This
          # matches the authoritative build metadata and keeps the output path
          # outside the remapped `/project` tree. Remove it before each run so
          # every comparison starts with a clean target tree. The exact target
          # standard library is provisioned before the first measured build and
          # its sysroot fingerprint is captured around that build below.
          repro_target_dir="target"
          rm -rf "$repro_target_dir"
          cross_install_target="${RUNNER_TEMP}/zeroclaw-cross-install"
          rm -rf "$cross_install_target"
          mkdir -p "$cross_install_target"
          export CARGO_TARGET_DIR="$cross_install_target"
          unset RUSTUP_TOOLCHAIN
          rustup toolchain install "$toolchain_version" --profile minimal
          rustup default "$toolchain_version"
          rustup target add --toolchain "$toolchain_version" "${{ steps.metadata.outputs.target }}"
          rustup run "$toolchain_version" cargo install cross --version "${{ steps.metadata.outputs.cross_version }}" --locked
          cross_bin="$(command -v cross)"
          test -x "$cross_bin"
          toolchain_real="$(rustup which --toolchain "$toolchain_version" rustc)"
          toolchain_root="$(cd "$(dirname "$toolchain_real")/.." && pwd)"
          {
            printf 'toolchain_version=%s\n' "$toolchain_version"
            printf 'toolchain_real=%s\n' "$toolchain_real"
            printf 'toolchain_root=%s\n' "$toolchain_root"
            rustup show active-toolchain
            "$toolchain_real" -vV
            "$toolchain_root/bin/cargo" -vV
            printf 'toolchain_sysroot='; "$toolchain_real" --print sysroot
            sha256sum \
              "$toolchain_real" \
              "$toolchain_root/bin/cargo"
            find "$toolchain_root/lib" -maxdepth 1 -type f \( \
              -name 'librustc_driver-*.so' -o -name 'libLLVM-*.so' \) \
              -print0 | sort -z | xargs -0 -r sha256sum
          } > /tmp/zeroclaw-toolchain-host.txt
          (
            cd "$toolchain_root" || exit 1
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) > /tmp/zeroclaw-toolchain-files.txt
          docker run --rm \
            --network none \
            --mount "type=bind,src=$toolchain_root,dst=/rust,readonly" \
            --entrypoint /bin/sh \
            "$cross_image_ref" \
            -ec '
              set -eu
              export PATH=/rust/bin:$PATH
              export LD_LIBRARY_PATH=/rust/lib:/rust/lib/rustlib/x86_64-unknown-linux-gnu/lib
              sha256sum /rust/bin/rustc /rust/bin/cargo
              /rust/bin/rustc -vV
              /rust/bin/cargo -vV
              printf "sysroot="; /rust/bin/rustc --print sysroot
              ldd /rust/bin/rustc || true
              printf "uname="; uname -a
              printf "nproc="; nproc
            ' > /tmp/zeroclaw-toolchain-container.txt
          # Cross owns the host/container target mount. Do not pass its
          # CARGO_TARGET_DIR through the build environment or override the
          # target root with a Cargo CLI option.
          unset CARGO_TARGET_DIR
          dependency_manifest() {
            local dep_dir="$1"
            local output="$2"
            if [ -d "$dep_dir" ]; then
              (
                cd "$dep_dir" || exit 1
                find . -maxdepth 1 -type f \( -name '*.rlib' -o -name '*.rmeta' \) \
                  -print0 | sort -z | xargs -0 -r sha256sum
              ) > "$output"
            else
              : > "$output"
            fi
          }
          sysroot_manifest() {
            local sysroot_lib="$1"
            local output="$2"
            test -d "$sysroot_lib"
            (
              cd "$sysroot_lib" || exit 1
              find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum
            ) > "$output"
          }
          rust_sysroot="$(rustc --print sysroot)"
          target_sysroot="$rust_sysroot/lib/rustlib/${{ steps.metadata.outputs.target }}/lib"
          printf 'rustc sysroot=%s\n' "$rust_sysroot"
          printf 'target sysroot=%s\n' "$target_sysroot"
          rustup target list --installed
          sysroot_manifest "$target_sysroot" /tmp/zeroclaw-sysroot-before.txt
          capture_build_diagnostics() {
            local variant="$1"
            local output="$2"
            local cargo_jobs="$3"
            {
              printf 'variant=%s\n' "$variant"
              printf 'cargo_jobs_cli=%s\n' "$cargo_jobs"
              for name in \
                RUSTUP_TOOLCHAIN RUSTUP_HOME CARGO_HOME CARGO_TARGET_DIR \
                CARGO_BUILD_JOBS RAYON_NUM_THREADS RUSTFLAGS CARGO_ENCODED_RUSTFLAGS \
                CARGO_PROFILE_RELEASE_LTO CARGO_PROFILE_RELEASE_CODEGEN_UNITS \
                RUSTC RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER \
                CARGO_BUILD_RUSTC CARGO_BUILD_RUSTC_WRAPPER CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER \
                CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS \
                CROSS_CONTAINER_OPTS \
                CC CXX AR CFLAGS CXXFLAGS LDFLAGS; do
                if value="$(printenv "$name" 2>/dev/null)"; then
                  printf '%s=%s\n' "$name" "$value"
                else
                  printf '%s=<unset>\n' "$name"
                fi
              done
              printf 'active_toolchain='; rustup show active-toolchain
              rustc -vV
              cargo -vV
              printf 'rustc_sysroot='; rustc --print sysroot
              printf 'rustc_path=%s\n' "$(command -v rustc)"
              printf 'cargo_path=%s\n' "$(command -v cargo)"
              printf 'cross_path=%s\n' "$cross_bin"
              sha256sum "$(command -v rustc)" "$(command -v cargo)" "$cross_bin"
              printf 'nproc='; nproc
              printf 'runner_arch=%s\n' "$(uname -m)"
            } > "$output"
          }
          # Isolate Cargo's jobserver width on the same runner. Keep the host
          # toolchain and Cross container environment fixed; only --jobs changes
          # between these target-clean builds. CI exposes 4 CPUs while the
          # authoritative local replay exposed 8, so use 8/4/8 to test whether
          # Cargo's scheduler width is the remaining reproducibility variable.
          unset RUSTUP_TOOLCHAIN CARGO_BUILD_JOBS RAYON_NUM_THREADS CROSS_CONTAINER_OPTS
          write_cross_config
          capture_build_diagnostics 'cargo-jobs-8-first' /tmp/zeroclaw-jobs-first.txt 8
          printf 'Cargo --jobs variant=8 (first)\n'
          "$cross_bin" build -vv --release --locked --jobs 8 \
            --target "${{ steps.metadata.outputs.target }}" \
            --manifest-path Cargo.toml
          rebuilt="$repro_target_dir/${{ steps.metadata.outputs.target }}/release/zeroclaw"
          test -f "$rebuilt"
          rebuilt_sha="$(sha256sum "$rebuilt" | awk '{print $1}')"
          dependency_manifest \
            "$repro_target_dir/${{ steps.metadata.outputs.target }}/release/deps" \
            /tmp/zeroclaw-deps-first.txt
          sysroot_manifest "$target_sysroot" /tmp/zeroclaw-sysroot-after-first.txt
          cp "$rebuilt" /tmp/zeroclaw-rebuild-first
          rm -rf "$repro_target_dir"
          write_cross_config
          capture_build_diagnostics 'cargo-jobs-4-second' /tmp/zeroclaw-jobs-second.txt 4
          printf 'Cargo --jobs variant=4 (second)\n'
          "$cross_bin" build -vv --release --locked --jobs 4 \
            --target "${{ steps.metadata.outputs.target }}" \
            --manifest-path Cargo.toml
          repeated="$repro_target_dir/${{ steps.metadata.outputs.target }}/release/zeroclaw"
          test -f "$repeated"
          repeat_sha="$(sha256sum "$repeated" | awk '{print $1}')"
          dependency_manifest \
            "$repro_target_dir/${{ steps.metadata.outputs.target }}/release/deps" \
            /tmp/zeroclaw-deps-second.txt
          cp "$repeated" /tmp/zeroclaw-rebuild-second
          rm -rf "$repro_target_dir"
          write_cross_config
          capture_build_diagnostics 'cargo-jobs-8-third' /tmp/zeroclaw-jobs-third.txt 8
          printf 'Cargo --jobs variant=8 (third)\n'
          "$cross_bin" build -vv --release --locked --jobs 8 \
            --target "${{ steps.metadata.outputs.target }}" \
            --manifest-path Cargo.toml
          third="$repro_target_dir/${{ steps.metadata.outputs.target }}/release/zeroclaw"
          test -f "$third"
          third_sha="$(sha256sum "$third" | awk '{print $1}')"
          dependency_manifest \
            "$repro_target_dir/${{ steps.metadata.outputs.target }}/release/deps" \
            /tmp/zeroclaw-deps-third.txt
          cp "$third" /tmp/zeroclaw-rebuild-third
          printf 'reproducibility hashes (Cargo --jobs 8/4/8): first=%s second=%s third=%s expected=%s\n' \
            "$rebuilt_sha" "$repeat_sha" "$third_sha" "${{ steps.metadata.outputs.binary_sha }}"
          printf 'dependency manifest hashes: first=%s second=%s third=%s\n' \
            "$(sha256sum /tmp/zeroclaw-deps-first.txt | awk '{print $1}')" \
            "$(sha256sum /tmp/zeroclaw-deps-second.txt | awk '{print $1}')" \
            "$(sha256sum /tmp/zeroclaw-deps-third.txt | awk '{print $1}')"
          binary_gate=0
          if cmp -s /tmp/zeroclaw-rebuild-first /tmp/zeroclaw-rebuild-third; then
            echo 'binary jobs8_first_vs_jobs8_third: identical'
          else
            echo 'binary jobs8_first_vs_jobs8_third: DIFFERENT'
            binary_gate=1
          fi
          if [ "$rebuilt_sha" = "$third_sha" ]; then
            echo 'binary SHA jobs8_first_vs_jobs8_third: equal'
          else
            echo 'binary SHA jobs8_first_vs_jobs8_third: DIFFERENT'
            binary_gate=1
          fi
          if [ "$repeat_sha" = "$rebuilt_sha" ]; then
            echo 'binary SHA jobs4_second_matches_jobs8: equal'
          else
            echo "binary SHA jobs4_second_differs_from_jobs8: $repeat_sha"
          fi
          recorded_gate=0
          for observed_sha in "$rebuilt_sha" "$third_sha"; do
            if [ "$observed_sha" = "${{ steps.metadata.outputs.binary_sha }}" ]; then
              echo "recorded SHA match: $observed_sha"
            else
              echo "recorded SHA mismatch: observed=$observed_sha expected=${{ steps.metadata.outputs.binary_sha }}"
              recorded_gate=1
            fi
          done
          test "$binary_gate" -eq 0
          test "$recorded_gate" -eq 0
          unset RUSTUP_TOOLCHAIN
          popd >/dev/null
          cp /tmp/zeroclaw-rebuild-third zeroclaw/zeroclaw-bin
          test "$(sha256sum zeroclaw/zeroclaw-bin | awk '{print $1}')" = "${{ steps.metadata.outputs.binary_sha }}"

      - name: Collect reproducibility diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          mkdir -p repro-diagnostics
          first=/tmp/zeroclaw-rebuild-first
          second=/tmp/zeroclaw-rebuild-second
          third=/tmp/zeroclaw-rebuild-third
          {
            for item in "$first" "$second" "$third"; do
              if [ -f "$item" ]; then
                printf 'size_bytes=%s ' "$(stat -c '%s' "$item" 2>/dev/null || wc -c < "$item")"
                sha256sum "$item"
                file "$item"
              fi
            done
          } | tee repro-diagnostics/summary.txt
          [ -f "$first" ] && cp "$first" repro-diagnostics/first.elf
          [ -f "$second" ] && cp "$second" repro-diagnostics/second.elf
          [ -f "$third" ] && cp "$third" repro-diagnostics/third.elf
          for item in /tmp/zeroclaw-deps-first.txt /tmp/zeroclaw-deps-second.txt /tmp/zeroclaw-deps-third.txt; do
            [ -f "$item" ] && cp "$item" repro-diagnostics/"$(basename "$item")"
          done
          for item in /tmp/zeroclaw-sysroot-before.txt /tmp/zeroclaw-sysroot-after-first.txt; do
            [ -f "$item" ] && cp "$item" repro-diagnostics/"$(basename "$item")"
          done
          for item in /tmp/zeroclaw-jobs-first.txt /tmp/zeroclaw-jobs-second.txt /tmp/zeroclaw-jobs-third.txt; do
            [ -f "$item" ] && cp "$item" repro-diagnostics/"$(basename "$item")"
          done
          for item in /tmp/zeroclaw-toolchain-host.txt /tmp/zeroclaw-toolchain-files.txt /tmp/zeroclaw-toolchain-container.txt; do
            [ -f "$item" ] && cp "$item" repro-diagnostics/"$(basename "$item")"
          done
          for item in "$RUNNER_TEMP"/zeroclaw-direct-host.txt "$RUNNER_TEMP"/zeroclaw-direct-container.txt "$RUNNER_TEMP"/zeroclaw-direct-build.log "$RUNNER_TEMP"/zeroclaw-direct-summary.txt; do
            [ -f "$item" ] && cp "$item" repro-diagnostics/"$(basename "$item")"
          done
          if [ -d "$RUNNER_TEMP/zeroclaw-direct-deps" ]; then
            mkdir -p repro-diagnostics/zeroclaw-direct-deps
            cp "$RUNNER_TEMP"/zeroclaw-direct-deps/* repro-diagnostics/zeroclaw-direct-deps/ 2>/dev/null || true
          fi
          for item in \
            "$RUNNER_TEMP"/zeroclaw-direct-aa-host.txt \
            "$RUNNER_TEMP"/zeroclaw-direct-aa-container-a.txt \
            "$RUNNER_TEMP"/zeroclaw-direct-aa-container-b.txt \
            "$RUNNER_TEMP"/zeroclaw-direct-aa-build-a.log \
            "$RUNNER_TEMP"/zeroclaw-direct-aa-build-b.log \
            "$RUNNER_TEMP"/zeroclaw-direct-aa-summary-a.txt \
            "$RUNNER_TEMP"/zeroclaw-direct-aa-summary-b.txt \
            "$RUNNER_TEMP"/zeroclaw-direct-aa-a.elf \
            "$RUNNER_TEMP"/zeroclaw-direct-aa-b.elf; do
            [ -f "$item" ] && cp "$item" repro-diagnostics/"$(basename "$item")"
          done
          if [ -d "$RUNNER_TEMP/zeroclaw-direct-aa-deps" ]; then
            mkdir -p repro-diagnostics/zeroclaw-direct-aa-deps
            cp -R "$RUNNER_TEMP/zeroclaw-direct-aa-deps/." repro-diagnostics/zeroclaw-direct-aa-deps/ 2>/dev/null || true
          fi
          : > repro-diagnostics/byte-difference-summary.txt
          byte_diff_summary() {
            local label="$1"
            local left="$2"
            local right="$3"
            printf '%s: ' "$label"
            cmp -l "$left" "$right" | awk '
              NR == 1 { first_offset = $1 }
              { last_offset = $1; count++ }
              END {
                if (count) {
                  printf "different_bytes=%d first_offset=%s last_offset=%s\n", count, first_offset, last_offset
                } else {
                  print "identical"
                }
              }
            '
          }
          if [ -f "$first" ] && [ -f "$second" ]; then
            cmp -l "$first" "$second" | head -n 128 > repro-diagnostics/first-differences.txt
            byte_diff_summary first_vs_second "$first" "$second" >> repro-diagnostics/byte-difference-summary.txt
            readelf -W -h -n -S "$first" > repro-diagnostics/first-readelf.txt 2>&1
            readelf -W -h -n -S "$second" > repro-diagnostics/second-readelf.txt 2>&1
          fi
          if [ -f "$first" ] && [ -f "$third" ]; then
            byte_diff_summary first_vs_third "$first" "$third" >> repro-diagnostics/byte-difference-summary.txt
            readelf -W -h -n -S "$third" > repro-diagnostics/third-readelf.txt 2>&1
          fi
          if [ -f "$second" ] && [ -f "$third" ]; then
            byte_diff_summary second_vs_third "$second" "$third" >> repro-diagnostics/byte-difference-summary.txt
          fi
          direct_aa_a="$RUNNER_TEMP/zeroclaw-direct-aa-a.elf"
          direct_aa_b="$RUNNER_TEMP/zeroclaw-direct-aa-b.elf"
          if [ -f "$direct_aa_a" ] && [ -f "$direct_aa_b" ]; then
            {
              for item in "$direct_aa_a" "$direct_aa_b"; do
                printf 'size_bytes=%s ' "$(stat -c '%s' "$item" 2>/dev/null || wc -c < "$item")"
                sha256sum "$item"
                file "$item"
              done
            } > repro-diagnostics/direct-aa-summary.txt
            cmp -l "$direct_aa_a" "$direct_aa_b" | head -n 128 > repro-diagnostics/direct-aa-differences.txt
            byte_diff_summary direct_aa_a_vs_b "$direct_aa_a" "$direct_aa_b" >> repro-diagnostics/byte-difference-summary.txt
            readelf -W -h -n -S "$direct_aa_a" > repro-diagnostics/direct-aa-a-readelf.txt 2>&1
            readelf -W -h -n -S "$direct_aa_b" > repro-diagnostics/direct-aa-b-readelf.txt 2>&1
          fi

      - name: Upload reproducibility diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeroclaw-repro-diagnostics-${{ github.run_id }}
          path: repro-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push signed candidate image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: zeroclaw
          file: zeroclaw/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.candidate_tag }}
          build-args: |
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            ZEROCLAW_SHA256=${{ steps.metadata.outputs.binary_sha }}
            ZEROCLAW_SOURCE_COMMIT=${{ steps.metadata.outputs.source_commit }}
            ZEROCLAW_SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}
            ZEROCLAW_LLVM_RNG_SEED=${{ steps.metadata.outputs.llvm_rng_seed }}
            REQUIRE_VERIFIED_ARTIFACT=true
          provenance: mode=max

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SPDX SBOM for the exact arm64 candidate digest
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          "${{ steps.syft.outputs.cmd }}" scan \
            --platform linux/arm64 \
            "$IMAGE" \
            -o spdx-json=sbom.spdx.json
          test -s sbom.spdx.json

      - name: Upload candidate SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeroclaw-sbom-${{ github.run_id }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 3

      - name: Prepare registry credentials for attestation action
        shell: bash
        run: |
          set -euo pipefail
          source_config_dir="${DOCKER_CONFIG:-$HOME/.docker}"
          source_config="$source_config_dir/config.json"
          attest_home="$RUNNER_TEMP/zeroclaw-attest-home"
          test -s "$source_config"
          rm -rf -- "$attest_home"
          mkdir -p "$attest_home/.docker"
          cp "$source_config" "$attest_home/.docker/config.json"
          chmod 700 "$attest_home" "$attest_home/.docker"
          chmod 600 "$attest_home/.docker/config.json"

      - name: Attest candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          HOME: ${{ runner.temp }}/zeroclaw-attest-home
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest candidate SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          HOME: ${{ runner.temp }}/zeroclaw-attest-home
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Remove attestation credential copy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          attest_home="$RUNNER_TEMP/zeroclaw-attest-home"
          case "$attest_home" in
            "$RUNNER_TEMP/"zeroclaw-attest-home) ;;
            *) echo "unexpected attestation credential path" >&2; exit 1 ;;
          esac
          rm -rf -- "$attest_home"

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign candidate digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Verify candidate signature, provenance, and SBOM attestations
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_CERTIFICATE_IDENTITY: ${{ steps.metadata.outputs.certificate_identity }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image_ref="${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="$COSIGN_CERTIFICATE_IDENTITY" "$image_ref"
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://spdx.dev/Document/v2.3

  canary:
    name: Approve exact candidate after HA canary
    needs: candidate
    if: ${{ inputs.promote == true }}
    runs-on: ubuntu-latest
    environment:
      name: canary
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Require operator evidence for the exact candidate digest
        env:
          CANARY_DIGEST: ${{ inputs.canary_digest }}
          CANARY_EVIDENCE: ${{ inputs.canary_evidence }}
        run: |
          set -euo pipefail
          test "$CANARY_DIGEST" = "${{ needs.candidate.outputs.digest }}"
          test -n "$CANARY_EVIDENCE"
          echo "Canary evidence: $CANARY_EVIDENCE"

      - name: Re-verify candidate before promotion
        env:
          COSIGN_EXPERIMENTAL: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image_ref="${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            "$image_ref"
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://spdx.dev/Document/v2.3

  promote:
    name: Promote exact canaried digest and create release tag
    needs: [candidate, canary]
    if: ${{ inputs.promote == true }}
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate digest to immutable Supervisor tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ needs.candidate.outputs.image }}"
          digest="${{ needs.candidate.outputs.digest }}"
          version="${{ needs.candidate.outputs.version }}"
          release_tag="${{ needs.candidate.outputs.release_tag }}"
          docker buildx imagetools create --tag "$image:$version" "$image@$digest"
          docker buildx imagetools create --tag "$image:$release_tag" "$image@$digest"
          for tag in "$version" "$release_tag"; do
            resolved="$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')"
            test "$resolved" = "$digest"
          done

      - name: Sign and verify the promoted digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          image_ref="${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}"
          cosign sign --yes "$image_ref"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            "$image_ref"

      - name: Create the Git release tag only after promotion
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ needs.candidate.outputs.release_tag }}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "release tag already exists: $release_tag" >&2
            exit 1
          fi
          git tag -a "$release_tag" "$GITHUB_SHA" -m "ZeroClaw Home Assistant app $release_tag"
          git push origin "refs/tags/$release_tag"
