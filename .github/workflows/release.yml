name: Publish signed native candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Qualify native candidate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  candidate:
    name: Publish exact reviewed source as a signed candidate
    needs: acceptance
    if: startsWith(github.ref, 'refs/heads/') && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release-builder
    concurrency:
      group: zeroclaw-native-candidate
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require the protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/release-builder" \
            --jq '.protection_rules' > "$RUNNER_TEMP/release-protection.json"
          jq -e 'any(.[]; .type == "required_reviewers" and (.reviewers | length) > 0)' \
            "$RUNNER_TEMP/release-protection.json" >/dev/null
      - name: Identify the exact source and candidate tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          image=ghcr.io/nafjan/zeroclaw-ha-addon
          app_version="4.0.0-dev.g${GITHUB_SHA:0:12}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          tag="$app_version"
          printf 'image=%s\ntag=%s\napp_version=%s\n' "$image" "$tag" "$app_version" >> "$GITHUB_OUTPUT"
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish a candidate with provenance and SBOM
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: zeroclaw
          file: zeroclaw/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
          build-args: |
            APP_SOURCE_REVISION=${{ github.sha }}
            APP_VERSION=${{ steps.metadata.outputs.app_version }}
          provenance: mode=max
          sbom: true
      - name: Attest the published candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign and verify the immutable image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG: ${{ steps.metadata.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$GITHUB_REF" == refs/heads/* ]]
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="$identity" "$IMAGE@$DIGEST" >/dev/null
          printf '### Signed native candidate\n\nImage tag: `%s:%s`\n\nImmutable digest: `%s@%s`\n\nHome Assistant app version: `%s`\n\nSource: `%s`\n\nSource ref: `%s`\n\nRun: `%s` (attempt `%s`)\n\nNo stable alias was published.\n' \
            "$IMAGE" "$TAG" "$IMAGE" "$DIGEST" "$APP_VERSION" "$GITHUB_SHA" \
            "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
