name: Release signed Supervisor image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to create after promotion, for example v3.1.3.5"
        required: true
        type: string
      promote:
        description: "Run the protected canary and production promotion gates"
        required: true
        default: false
        type: boolean
      canary_digest:
        description: "Candidate digest copied from the build job after the HA canary"
        required: false
        type: string
      canary_evidence:
        description: "Link or ticket identifying the completed read-only HA canary"
        required: false
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    name: Complete acceptance suite before candidate publication
    uses: ./.github/workflows/test.yml
    with:
      require_verified_artifact: true
    permissions:
      contents: read

  candidate:
    name: Rebuild, attest, and sign candidate digest
    needs: acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      candidate_tag: ${{ steps.metadata.outputs.candidate_tag }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      certificate_identity: ${{ steps.metadata.outputs.certificate_identity }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" {print $2; exit}' zeroclaw/config.yaml)"
          release_tag="$RELEASE_TAG"
          release_version="${release_tag#v}"
          source_repository="$(jq -r '.source_repository' zeroclaw/binary-manifest.json)"
          source_commit="$(jq -r '.source_commit' zeroclaw/binary-manifest.json)"
          source_date_epoch="$(jq -r '.source_date_epoch' zeroclaw/binary-manifest.json)"
          source_lockfile_sha256="$(jq -r '.source_lockfile_sha256' zeroclaw/binary-manifest.json)"
          llvm_rng_seed="$(jq -r '.llvm_rng_seed' zeroclaw/binary-manifest.json)"
          target="$(jq -r '.target' zeroclaw/binary-manifest.json)"
          rust_toolchain="$(jq -r '.rust_toolchain' zeroclaw/binary-manifest.json)"
          cross_version="$(jq -r '.cross_version' zeroclaw/binary-manifest.json)"
          cross_image_digest="$(jq -r '.cross_image_digest' zeroclaw/binary-manifest.json)"
          cargo_incremental="$(jq -r '.cargo_incremental' zeroclaw/binary-manifest.json)"
          cargo_build_jobs="$(jq -r '.cargo_build_jobs' zeroclaw/binary-manifest.json)"
          rustflags="$(jq -r '.rustflags' zeroclaw/binary-manifest.json)"
          artifact_status="$(jq -r '.artifact_status' zeroclaw/binary-manifest.json)"
          build_command="$(jq -r '.build_command' zeroclaw/binary-manifest.json)"
          binary_sha="$(jq -r '.sha256' zeroclaw/binary-manifest.json)"
          configured_image="$(awk '$1 == "image:" {print $2; exit}' zeroclaw/config.yaml)"
          image="$(printf '%s' "$configured_image" | tr '[:upper:]' '[:lower:]')"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}"
          test "$GITHUB_REPOSITORY" = "Nafjan/zeroclaw-ha-addon"
          test "$release_version" = "$version"
          printf '%s' "$release_tag" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          test "$source_repository" = "https://github.com/zeroclaw-labs/zeroclaw.git"
          test "$source_commit" != "null"
          test "$source_date_epoch" != "null"
          test "$source_lockfile_sha256" != "null"
          test "$llvm_rng_seed" = "0"
          test "$target" = "aarch64-unknown-linux-musl"
          test "$rust_toolchain" = "1.89.0"
          test "$cross_version" = "0.2.5"
          printf '%s' "$cross_image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$cargo_incremental" = "false"
          test "$cargo_build_jobs" = "1"
          test "$artifact_status" = "verified"
          test -n "$rustflags"
          test "$build_command" = "cargo build --release --locked --jobs 1 --target aarch64-unknown-linux-musl"
          test -n "$binary_sha"
          test -n "$image"
          {
            printf 'version=%s\n' "$version"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
            printf 'source_lockfile_sha256=%s\n' "$source_lockfile_sha256"
            printf 'llvm_rng_seed=%s\n' "$llvm_rng_seed"
            printf 'target=%s\n' "$target"
            printf 'rust_toolchain=%s\n' "$rust_toolchain"
            printf 'cross_version=%s\n' "$cross_version"
            printf 'cross_image_digest=%s\n' "$cross_image_digest"
            printf 'cargo_incremental=%s\n' "$cargo_incremental"
            printf 'cargo_build_jobs=%s\n' "$cargo_build_jobs"
            printf 'rustflags=%s\n' "$rustflags"
            printf 'binary_sha=%s\n' "$binary_sha"
            printf 'image=%s\n' "$image"
            printf 'candidate_tag=%s\n' "$candidate_tag"
            printf 'certificate_identity=%s\n' "$certificate_identity"
          } >> "$GITHUB_OUTPUT"

      - name: Check out pinned ZeroClaw source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: ${{ steps.metadata.outputs.source_commit }}
          path: .zeroclaw-source
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Rebuild and verify the recorded ZeroClaw artifact
        shell: bash
        env:
          CROSS_CONTAINER_ENGINE: docker
          CROSS_DEBUG: "1"
          RUSTUP_TOOLCHAIN: ${{ steps.metadata.outputs.rust_toolchain }}
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: ${{ steps.metadata.outputs.cargo_build_jobs }}
        run: |
          set -euo pipefail
          test "$(git -C .zeroclaw-source rev-parse HEAD)" = "${{ steps.metadata.outputs.source_commit }}"
          source_epoch="$(git -C .zeroclaw-source show -s --format=%ct HEAD)"
          test "$source_epoch" = "${{ steps.metadata.outputs.source_date_epoch }}"
          lock_sha="$(sha256sum .zeroclaw-source/Cargo.lock | awk '{print $1}')"
          test "$lock_sha" = "${{ steps.metadata.outputs.source_lockfile_sha256 }}"
          cross_image="ghcr.io/cross-rs/aarch64-unknown-linux-musl:${{ steps.metadata.outputs.cross_version }}"
          docker pull "$cross_image"
          docker image inspect "$cross_image" --format '{{json .RepoDigests}}' | grep -F "ghcr.io/cross-rs/aarch64-unknown-linux-musl@${{ steps.metadata.outputs.cross_image_digest }}" >/dev/null
          export SOURCE_DATE_EPOCH="$source_epoch"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="${{ steps.metadata.outputs.rustflags }}"
          cat > .cross-release.toml <<EOF
          [build.env]
          passthrough = [
            "SOURCE_DATE_EPOCH",
            "CARGO_INCREMENTAL",
            "CARGO_BUILD_JOBS",
            "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS",
            "RUSTUP_TOOLCHAIN",
          ]

          [target.aarch64-unknown-linux-musl]
          image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl@${{ steps.metadata.outputs.cross_image_digest }}"
          EOF
          export CROSS_CONFIG="$PWD/.cross-release.toml"
          # Build from the pinned source checkout root. The recorded artifact was
          # built with --remap-path-prefix=/project=.; compiling from the parent
          # checkout would preserve a different `.zeroclaw-source/` prefix.
          pushd .zeroclaw-source >/dev/null
          # Use Cross's canonical target root: it mounts the host checkout's
          # `target/` directory as `/target` inside the build container. This
          # matches the authoritative build metadata and keeps the output path
          # outside the remapped `/project` tree. Remove it between runs so
          # the second build is still clean and independent.
          repro_target_dir="target"
          rm -rf "$repro_target_dir"
          cross_install_target="${RUNNER_TEMP}/zeroclaw-cross-install"
          rm -rf "$cross_install_target"
          mkdir -p "$cross_install_target"
          export CARGO_TARGET_DIR="$cross_install_target"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
          cargo install cross --version "${{ steps.metadata.outputs.cross_version }}" --locked
          # Cross owns the host/container target mount. Do not pass its
          # CARGO_TARGET_DIR through the build environment or override the
          # target root with a Cargo CLI option.
          unset CARGO_TARGET_DIR
          cross build --release --locked \
            --jobs "${{ steps.metadata.outputs.cargo_build_jobs }}" \
            --target "${{ steps.metadata.outputs.target }}" \
            --manifest-path Cargo.toml
          rebuilt="$repro_target_dir/${{ steps.metadata.outputs.target }}/release/zeroclaw"
          test -f "$rebuilt"
          rebuilt_sha="$(sha256sum "$rebuilt" | awk '{print $1}')"
          cp "$rebuilt" /tmp/zeroclaw-rebuild-first
          rm -rf "$repro_target_dir"
          cross build --release --locked \
            --jobs "${{ steps.metadata.outputs.cargo_build_jobs }}" \
            --target "${{ steps.metadata.outputs.target }}" \
            --manifest-path Cargo.toml
          repeated="$repro_target_dir/${{ steps.metadata.outputs.target }}/release/zeroclaw"
          test -f "$repeated"
          repeat_sha="$(sha256sum "$repeated" | awk '{print $1}')"
          printf 'reproducibility hashes: first=%s second=%s expected=%s\n' \
            "$rebuilt_sha" "$repeat_sha" "${{ steps.metadata.outputs.binary_sha }}"
          cmp -s /tmp/zeroclaw-rebuild-first "$repeated"
          test "$rebuilt_sha" = "$repeat_sha"
          test "$repeat_sha" = "${{ steps.metadata.outputs.binary_sha }}"
          popd >/dev/null
          cp /tmp/zeroclaw-rebuild-first zeroclaw/zeroclaw-bin
          test "$(sha256sum zeroclaw/zeroclaw-bin | awk '{print $1}')" = "${{ steps.metadata.outputs.binary_sha }}"

      - name: Collect reproducibility diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          mkdir -p repro-diagnostics
          first=/tmp/zeroclaw-rebuild-first
          second=.zeroclaw-source/target/${{ steps.metadata.outputs.target }}/release/zeroclaw
          for item in "$first" "$second"; do
            if [ -f "$item" ]; then
              sha256sum "$item"
              file "$item"
            fi
          done | tee repro-diagnostics/summary.txt
          [ -f "$first" ] && cp "$first" repro-diagnostics/first.elf
          [ -f "$second" ] && cp "$second" repro-diagnostics/second.elf
          if [ -f "$first" ] && [ -f "$second" ]; then
            cmp -l "$first" "$second" | head -n 128 > repro-diagnostics/first-differences.txt
            readelf -h -n -S "$first" > repro-diagnostics/first-readelf.txt 2>&1
            readelf -h -n -S "$second" > repro-diagnostics/second-readelf.txt 2>&1
          fi

      - name: Upload reproducibility diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-repro-diagnostics-${{ github.run_id }}
          path: repro-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push signed candidate image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: zeroclaw
          file: zeroclaw/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.candidate_tag }}
          build-args: |
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            ZEROCLAW_SHA256=${{ steps.metadata.outputs.binary_sha }}
            ZEROCLAW_SOURCE_COMMIT=${{ steps.metadata.outputs.source_commit }}
            ZEROCLAW_SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}
            ZEROCLAW_LLVM_RNG_SEED=${{ steps.metadata.outputs.llvm_rng_seed }}
            REQUIRE_VERIFIED_ARTIFACT=true
          provenance: mode=max

      - name: Generate SPDX SBOM for the exact candidate digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attest candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest candidate SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign candidate digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Verify candidate signature, provenance, and SBOM attestations
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_CERTIFICATE_IDENTITY: ${{ steps.metadata.outputs.certificate_identity }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image_ref="${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="$COSIGN_CERTIFICATE_IDENTITY" "$image_ref"
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://spdx.dev/Document/v2.3

  canary:
    name: Approve exact candidate after HA canary
    needs: candidate
    if: ${{ inputs.promote == true }}
    runs-on: ubuntu-latest
    environment:
      name: canary
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Require operator evidence for the exact candidate digest
        env:
          CANARY_DIGEST: ${{ inputs.canary_digest }}
          CANARY_EVIDENCE: ${{ inputs.canary_evidence }}
        run: |
          set -euo pipefail
          test "$CANARY_DIGEST" = "${{ needs.candidate.outputs.digest }}"
          test -n "$CANARY_EVIDENCE"
          echo "Canary evidence: $CANARY_EVIDENCE"

      - name: Re-verify candidate before promotion
        env:
          COSIGN_EXPERIMENTAL: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image_ref="${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            "$image_ref"
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://spdx.dev/Document/v2.3

  promote:
    name: Promote exact canaried digest and create release tag
    needs: [candidate, canary]
    if: ${{ inputs.promote == true }}
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate digest to immutable Supervisor tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ needs.candidate.outputs.image }}"
          digest="${{ needs.candidate.outputs.digest }}"
          version="${{ needs.candidate.outputs.version }}"
          release_tag="${{ needs.candidate.outputs.release_tag }}"
          docker buildx imagetools create --tag "$image:$version" "$image@$digest"
          docker buildx imagetools create --tag "$image:$release_tag" "$image@$digest"
          for tag in "$version" "$release_tag"; do
            resolved="$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')"
            test "$resolved" = "$digest"
          done

      - name: Sign and verify the promoted digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          image_ref="${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}"
          cosign sign --yes "$image_ref"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            "$image_ref"

      - name: Create the Git release tag only after promotion
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ needs.candidate.outputs.release_tag }}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "release tag already exists: $release_tag" >&2
            exit 1
          fi
          git tag -a "$release_tag" "$GITHUB_SHA" -m "ZeroClaw Home Assistant app $release_tag"
          git push origin "refs/tags/$release_tag"
