name: Tests

on:
  push:
    branches: [master, main, "codex/**"]
  pull_request:
    branches: [master, main]
  workflow_call:

permissions:
  contents: read

jobs:
  bats:
    # Preserve the existing protected-branch check name.
    name: Bats unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Test native configuration, MCP discovery and migration recovery
        run: bats --tap --print-output-on-failure zeroclaw/tests/native_*.bats
      - name: Test canary tooling, fixture cleanup and candidate verification
        run: |
          python3 -B -m unittest discover -s zeroclaw/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

  shellcheck:
    name: Shell parsing and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check shipped text and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl $'\r' --include='*.sh' --include='Dockerfile' --include='*.yaml' --include='*.yml' zeroclaw .github; then
            echo 'CRLF detected in shipped text files' >&2
            exit 1
          fi
          sh -n zeroclaw/native/entrypoint.sh
          bash -n .github/scripts/qualify-native.sh
          bash -n .github/scripts/verify-master-protection.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for root in (Path('zeroclaw/native'), Path('zeroclaw/tests'), Path('.github/scripts')):
              for path in root.rglob('*.py'):
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          descriptors = [p.as_posix() for p in Path('.').rglob('config.yaml') if '.git' not in p.parts]
          assert descriptors == ['zeroclaw/config.yaml'], descriptors
          assert not Path('PII-REMEDIATION-PLAN.md').exists()
          assert not Path('zeroclaw/EXECUTION-GOAL.md').exists()
          PY
      - name: Check startup and qualification shell code
        env:
          SHELLCHECK_IMAGE: koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" "$SHELLCHECK_IMAGE" -s sh --severity=error /src/zeroclaw/native/entrypoint.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" "$SHELLCHECK_IMAGE" -s bash --severity=error /src/.github/scripts/qualify-native.sh /src/.github/scripts/verify-master-protection.sh

  container:
    name: Build and smoke-test arm64 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Verify pinned upstream artifact and exercise the native app
        run: bash .github/scripts/qualify-native.sh

  compatibility:
    name: Native HA MCP and state compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up ARM64 emulation for the legacy fixture
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Download and verify the native x86 fixture
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zeroclaw-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/zeroclaw-labs/zeroclaw/releases/download/v0.8.7/zeroclaw-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 3cc7f1c859a67524d5496260d29806190bc7127d2877a479a5496ce34b9b401a "$archive" | sha256sum -c -
      - name: Exercise real Home Assistant and native ZeroClaw MCP
        run: sudo -n python3 zeroclaw/tests/ha_native_mcp_smoke.py --pull --native-interop --zeroclaw-archive "$RUNNER_TEMP/zeroclaw-x86_64-unknown-linux-musl.tar.gz"
      - name: Exercise old/new runtime memory migration, restart and rollback
        run: python3 zeroclaw/tests/state_migration_smoke.py --old-binary zeroclaw/tests/fixtures/zeroclaw-0.7.5-aarch64 --new-archive "$RUNNER_TEMP/zeroclaw-x86_64-unknown-linux-musl.tar.gz"
